[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-weighted"
version = "0.1.0"
description = "Autonomous cash-secured put agent with contention-aware capital allocation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pypdf>=4.0.0"]

[project.scripts]
attention-weighted = "run:sync_main"

[tool.setuptools]
packages = ["src"]
py-modules = ["config", "run"]
